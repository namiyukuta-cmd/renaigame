<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>恋愛シュミレーション - はじめから</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: #f3edef;
      background-image: url("asset/ALEXANDER.PNG");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      color: #2c2528;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        calc(86px + env(safe-area-inset-bottom));
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      color: #6e6066;
      text-decoration: none;
      font-size: 17px;
    }

    h1 {
      margin: 28px 0;
      text-align: center;
      font-size: 28px;
      line-height: 1.4;
    }

    #app {
      width: 100%;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      padding-bottom: env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #faf7f8;
      border-top: 1px solid #cdbfc4;
      z-index: 20;
    }

    .bottom-nav button {
      min-width: 0;
      min-height: 62px;
      padding: 10px 4px;
      border: 0;
      background: transparent;
      color: #65585e;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .bottom-nav button.active {
      color: #2c2528;
      font-weight: 700;
      background: #eee5e8;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="simulation.html">← 恋愛シュミレーション</a>
    <h1>はじめから</h1>
    <section id="app"></section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="active" type="button">ホーム</button>
    <button type="button">恋愛相手</button>
    <button type="button">記録</button>
    <button type="button">プロフィール</button>
  </nav>
</body>
</html>
