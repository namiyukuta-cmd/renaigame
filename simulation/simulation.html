<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3edef">
  <title>恋愛シュミレーション</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#f3edef;color:#2c2528;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100dvh;overflow:hidden}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .screen{width:min(100%,520px);height:100dvh;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:1fr auto 1fr}
    .title-area{grid-row:2;width:100%;display:flex;flex-direction:column;align-items:center}
    .title{margin:0 0 64px;text-align:center;font-size:clamp(30px,8vw,42px);font-weight:600;letter-spacing:.06em;line-height:1.35}
    .menu{width:min(100%,340px);display:flex;flex-direction:column;gap:14px}
    .menu-button{width:100%;min-height:58px;padding:14px 18px;border:1px solid #bdaeb4;border-radius:12px;background:rgba(255,255,255,.78);color:#2c2528;font-size:19px;font-weight:600;cursor:pointer}
    .menu-button:active{transform:scale(.985);background:#e8dfe2}
    .menu-button:disabled{opacity:.55;cursor:default}
    .status{width:min(100%,340px);min-height:24px;margin:18px auto 0;text-align:center;font-size:14px;line-height:1.55;color:#6e6066}
    .status[data-kind="error"],.settings-status[data-kind="error"]{color:#8f3333}
    .status[data-kind="success"],.settings-status[data-kind="success"]{color:#35613f}
    dialog{width:min(calc(100% - 32px),460px);padding:0;border:1px solid #cdbfc4;border-radius:18px;background:#faf7f8;color:#2c2528;box-shadow:0 18px 55px rgba(41,29,34,.24)}
    dialog::backdrop{background:rgba(31,23,26,.42)}
    .settings-panel{padding:24px}
    .settings-title{margin:0 0 26px;font-size:24px;text-align:center}
    .field-label{display:block;margin-bottom:8px;font-size:15px;font-weight:600}
    .token-input{width:100%;min-height:48px;padding:10px 12px;border:1px solid #bcaeb3;border-radius:9px;background:#fff;color:#2c2528;font-size:16px}
    .settings-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
    .settings-actions button{min-height:44px;border:1px solid #bcaeb3;border-radius:9px;background:#fff;color:#2c2528;font-size:15px;cursor:pointer}
    .settings-actions button:active{background:#e8dfe2}
    .settings-actions button:disabled{opacity:.55}
    .settings-status{min-height:44px;margin:16px 0 0;font-size:14px;line-height:1.55;color:#6e6066}
  </style>
</head>
<body>
  <main class="screen">
    <section class="title-area" aria-labelledby="titleText">
      <h1 class="title" id="titleText"></h1>
      <nav class="menu" aria-label="タイトルメニュー">
        <button class="menu-button" id="startButton" type="button"></button>
        <button class="menu-button" id="continueButton" type="button"></button>
        <button class="menu-button" id="settingsButton" type="button"></button>
      </nav>
      <p class="status" id="statusText" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="settingsDialog">
    <div class="settings-panel">
      <h2 class="settings-title" id="settingsTitle"></h2>
      <label class="field-label" id="tokenLabel" for="tokenInput"></label>
      <input class="token-input" id="tokenInput" type="password" inputmode="text" autocomplete="off" spellcheck="false">
      <div class="settings-actions">
        <button id="saveTokenButton" type="button"></button>
        <button id="checkTokenButton" type="button"></button>
        <button id="deleteTokenButton" type="button"></button>
        <button id="closeSettingsButton" type="button"></button>
      </div>
      <p class="settings-status" id="settingsStatus" aria-live="polite"></p>
    </div>
  </dialog>

  <script src="../js/renaigame_save.js"></script>
  <script src="js/simulation_title.js"></script>
</body>
</html>
