name: Romance turn engine tests

on:
  push:
    paths:
      - "simulation-lite/**"
      - "index.html"
      - "simulation/js/**"
      - "simulation/css/**"
      - "simulation/state/templates/**"
      - "simulation/tests/**"
      - "simulation/scripts/**"
      - "simulation/AI_*.md"
      - "simulation/*.html"
      - "AGENTS.md"
      - "simulation/world/mizunagi/**"
      - "simulation/CHARACTER_CREATION_RULES.md"
      - "simulation/CHAPTER_SAVE_FORMAT.md"
      - "simulation/PROTAGONIST_CONTINUITY_RULES.md"
      - "simulation/ROMANCE_PREFERENCES.md"
      - "simulation/STORY_REVIEW_GATE.md"
      - "tests/unassigned-continuity-import.test.cjs"
      - "js/renaigame_psychology_parameters.js"
      - "js/renaigame_romance_rules.js"
      - "js/renaigame_policy.js"
      - ".github/workflows/ai-turn-tests.yml"
  pull_request:
    paths:
      - "simulation-lite/**"
      - "index.html"
      - "simulation/js/**"
      - "simulation/css/**"
      - "simulation/state/templates/**"
      - "simulation/tests/**"
      - "simulation/scripts/**"
      - "simulation/AI_*.md"
      - "simulation/*.html"
      - "AGENTS.md"
      - "simulation/world/mizunagi/**"
      - "simulation/CHARACTER_CREATION_RULES.md"
      - "simulation/CHAPTER_SAVE_FORMAT.md"
      - "simulation/PROTAGONIST_CONTINUITY_RULES.md"
      - "simulation/ROMANCE_PREFERENCES.md"
      - "simulation/STORY_REVIEW_GATE.md"
      - "tests/unassigned-continuity-import.test.cjs"
      - "js/renaigame_psychology_parameters.js"
      - "js/renaigame_romance_rules.js"
      - "js/renaigame_policy.js"
      - ".github/workflows/ai-turn-tests.yml"

# Superseded commits need not finish another copy of the same test suite.
concurrency:
  group: romance-turn-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-turn-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/scripts/generate_policy_reference.cjs --check
      - run: node simulation/scripts/generate_lite_catalog.cjs --check
      - run: node simulation/scripts/generate_lite_ai_notes.cjs --check
      - run: node simulation/tests/lite_loading.test.cjs
      - run: node simulation/tests/lite_private.test.cjs
      - run: node simulation/tests/lite_ai_save.test.cjs
      - run: node simulation/tests/lite_ui.test.cjs
      - run: node simulation/tests/policy_consistency.test.cjs
      - run: node simulation/tests/world_mizunagi.test.cjs
      - run: node simulation/tests/character_settings.test.cjs
      - run: node simulation/tests/ai_turn_engine.test.cjs
      - run: node simulation/tests/story_review.test.cjs
      - run: node simulation/tests/shared_story_direction.test.cjs
      - run: node simulation/tests/protagonist_priority.test.cjs
      - run: node simulation/tests/literary_review.test.cjs
      - run: node simulation/tests/chapter_header.test.cjs
      - run: node simulation/tests/support_progress.test.cjs
      - run: node simulation/tests/romance_progress.test.cjs
      - run: node tests/unassigned-continuity-import.test.cjs
      - run: node simulation/tests/ai_turn_runtime.test.cjs
      - run: node simulation/tests/ai_turn_sources.test.cjs
      - run: node simulation/tests/chapter_format.test.cjs
      - run: node simulation/tests/handoff.test.cjs
      - run: node simulation/tests/handoff_ui.test.cjs
      - run: node simulation/tests/chapter_import.test.cjs
      - run: node simulation/tests/chapter_paste_ui.test.cjs
      - run: node simulation/tests/slots.test.cjs
      - run: node tests/simulation-delete-slot-ui.test.cjs
      - run: node simulation/tests/chapter_save.test.cjs


