<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>PRISON - 手紙を書く</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #eeeeea;
      color: #252525;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 600px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        10px
        12px
        calc(18px + env(safe-area-inset-bottom));
    }

    /* =========================
       上部
    ========================= */

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.08em;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .top-button {
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid #aaa;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .top-button:active {
      background: #ddd;
    }

    /* =========================
       手紙＋右側ボタン
    ========================= */

    .write-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px;
      gap: 10px;
      align-items: start;
    }

    /* =========================
       赤枠：手紙を書く場所
    ========================= */

    .letter-paper {
      min-width: 0;
      padding: 14px;
      border: 2px solid #a63c2d;
      border-radius: 10px;
      background: #fff;
    }

    .letter-field {
      margin-bottom: 16px;
    }

    .letter-field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      margin: 0 0 5px;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 700;
      color: #555;
    }

    /* =========================
       黄色部分
    ========================= */

    .short-input,
    .recipient-box {
      width: 100%;
      min-height: 48px;
      padding: 9px 11px;
      border: 2px solid #99932a;
      border-radius: 8px;
      background: #fffef1;
      color: #222;
      font-size: 18px;
      line-height: 1.4;
    }

    .recipient-box {
      display: flex;
      align-items: center;
    }

    /* =========================
       黒枠：本文
    ========================= */

    .letter-body {
      display: block;
      width: 100%;
      min-height: 360px;
      padding: 13px;
      border: 2px solid #222;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 18px;
      line-height: 1.6;
      resize: vertical;
    }

    .letter-body::placeholder,
    .short-input::placeholder {
      color: #aaa;
    }

    /* =========================
       右側の青ボタン
    ========================= */

    .side-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-top: 170px;
    }

    .side-button {
      width: 82px;
      min-height: 82px;
      padding: 8px 5px;
      border: 2px solid #2468c7;
      border-radius: 10px;
      background: #fff;
      color: #245dab;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 700;
      cursor: pointer;
    }

    .side-button:active {
      background: #e9f1ff;
    }

    /* =========================
       紫：送る
    ========================= */

    .send-area {
      margin-top: 18px;
      padding-right: 92px;
    }

    .send-button {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 11px;
      background: #913cac;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:active {
      opacity: 0.8;
    }

    /* =========================
       モーダル共通
    ========================= */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 16px;
      background: rgba(0, 0, 0, 0.58);
      align-items: center;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
    }

    .modal-window {
      width: 100%;
      max-width: 520px;
      max-height: calc(100dvh - 32px);
      padding: 16px;
      border-radius: 12px;
      background: #f4f4ef;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-window h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 22px;
    }

    .close-button {
      width: 100%;
      min-height: 50px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      background: #777;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       過去ログ
    ========================= */

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .history-card {
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 9px;
      background: #fff;
    }

    .history-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .history-text {
      margin: 0;
      font-size: 17px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* =========================
       直近の彼の手紙
    ========================= */

    .latest-letter {
      font-size: 17px;
      line-height: 1.55;
    }

    .letter-pair {
      margin-bottom: 15px;
    }

    .letter-pair:last-child {
      margin-bottom: 0;
    }

    .letter-en {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
    }

    .letter-ja {
      margin: 2px 0 0;
      font-size: 17px;
      line-height: 1.5;
      color: #444;
    }

    /* =========================
       プロフィール
    ========================= */

    .profile-content {
      display: grid;
      gap: 8px;
      font-size: 17px;
      line-height: 1.45;
    }

    .profile-row {
      display: grid;
      grid-template-columns: 7em minmax(0, 1fr);
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid #ccc;
    }

    .profile-label {
      color: #666;
      font-weight: 700;
    }

    .profile-introduction {
      margin: 6px 0 0;
      padding: 11px;
      border-radius: 9px;
      background: #fff;
      font-size: 17px;
      line-height: 1.55;
    }

    /* =========================
       メッセージ
    ========================= */

    .message {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 200;
      width: calc(100% - 24px);
      max-width: 520px;
      padding: 12px;
      transform: translateX(-50%);
      border-radius: 9px;
      background: #222;
      color: #fff;
      text-align: center;
      font-size: 17px;
    }

    .message.show {
      display: block;
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top-bar">

      <h1 class="title">
        PRISON
      </h1>

      <div class="top-actions">

        <button
          id="profileButton"
          class="top-button"
          type="button"
        >
          プロフィール
        </button>

        <button
          id="topButton"
          class="top-button"
          type="button"
        >
          TOP
        </button>

      </div>

    </header>


    <div class="write-layout">

      <!-- 赤枠 -->
      <section class="letter-paper">

        <!-- 黄色：日付 -->
        <div class="letter-field">

          <label
            class="field-label"
            for="letterDate"
          >
            日付
          </label>

          <input
            id="letterDate"
            class="short-input"
            type="text"
            placeholder="January 22, 2023"
          >

        </div>


        <!-- 黄色：宛名 -->
        <div class="letter-field">

          <span class="field-label">
            宛名
          </span>

          <div
            id="recipientText"
            class="recipient-box"
          >
            Dear Mr. Caleb Ward,
          </div>

        </div>


        <!-- 黒枠：本文 -->
        <div class="letter-field">

          <label
            class="field-label"
            for="letterBody"
          >
            本文
          </label>

          <textarea
            id="letterBody"
            class="letter-body"
            placeholder="ここに手紙を書く"
          ></textarea>

        </div>


        <!-- 黄色：サイン -->
        <div class="letter-field">

          <label
            class="field-label"
            for="letterSignature"
          >
            サイン
          </label>

          <input
            id="letterSignature"
            class="short-input"
            type="text"
            placeholder="Buchi Usagi"
          >

        </div>

      </section>


      <!-- 青ボタン -->
      <aside class="side-buttons">

        <button
          id="historyButton"
          class="side-button"
          type="button"
        >
          過去<br>
          ログ
        </button>

        <button
          id="latestLetterButton"
          class="side-button"
          type="button"
        >
          直近の<br>
          手紙
        </button>

      </aside>

    </div>


    <!-- 紫ボタン -->
    <div class="send-area">

      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        送る
      </button>

    </div>

  </main>


  <!-- 過去ログ -->
  <div
    id="historyOverlay"
    class="overlay"
  >

    <div class="modal-window">

      <h2>
        今までのやり取り
      </h2>

      <div
        id="historyContent"
        class="history-list"
      ></div>

      <button
        id="closeHistoryButton"
        class="close-button"
        type="button"
      >
        閉じる
      </button>

    </div>

  </div>


  <!-- 直近の彼の手紙 -->
  <div
    id="latestLetterOverlay"
    class="overlay"
  >

    <div class="modal-window">

      <h2>
        直近のCalebの手紙
      </h2>

      <div
        id="latestLetterContent"
        class="latest-letter"
      ></div>

      <button
        id="closeLatestLetterButton"
        class="close-button"
        type="button"
      >
        閉じる
      </button>

    </div>

  </div>


  <!-- プロフィール -->
  <div
    id="profileOverlay"
    class="overlay"
  >

    <div class="modal-window">

      <h2>
        相手プロフィール
      </h2>

      <div
        id="profileContent"
        class="profile-content"
      ></div>

      <button
        id="closeProfileButton"
        class="close-button"
        type="button"
      >
        閉じる
      </button>

    </div>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <script src="../js/renaigame_common.js"></script>
  <script src="js/prison_common.js"></script>
  <script src="js/prison_character_001.js"></script>
  <script src="js/prison_write.js"></script>

</body>
</html>
