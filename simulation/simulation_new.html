<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>恋愛シュミレーション</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: #f3edef;
      background-image: url("asset/ALEXANDER.PNG");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 92% auto;
      color: #2c2528;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        calc(86px + env(safe-area-inset-bottom));
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      color: #6e6066;
      text-decoration: none;
      font-size: 17px;
    }

    .save-load {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .save-load button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid #bdaeb4;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.88);
      color: #2c2528;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-load button:active {
      background: #e8dfe2;
    }

    .save-load button:disabled {
      opacity: 0.55;
    }

    #app {
      width: 100%;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      padding-bottom: env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #faf7f8;
      border-top: 1px solid #cdbfc4;
      z-index: 20;
    }

    .bottom-nav button {
      min-width: 0;
      min-height: 62px;
      padding: 10px 4px;
      border: 0;
      background: transparent;
      color: #65585e;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .bottom-nav button.active {
      color: #2c2528;
      font-weight: 700;
      background: #eee5e8;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-bar">
      <a class="back-link" href="simulation.html">← 恋愛シュミレーション</a>
      <div class="save-load">
        <button id="saveButton" type="button">セーブ</button>
        <button id="loadButton" type="button">ロード</button>
      </div>
    </div>

    <section id="app"></section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="active" type="button">ホーム</button>
    <button type="button">恋愛相手</button>
    <button type="button">記録</button>
    <button type="button">プロフィール</button>
  </nav>

  <script src="js/simulation_save.js"></script>
  <script>
    const saveButton = document.getElementById('saveButton');
    const loadButton = document.getElementById('loadButton');

    saveButton.addEventListener('click', async () => {
      if (!RenaiGameSave.getToken()) {
        alert('タイトル画面の「設定」からGitHubトークンを設定してください。');
        return;
      }

      saveButton.disabled = true;
      try {
        await RenaiGameSave.saveToGitHub({
          version: 1,
          game: 'simulation',
          page: 'simulation_new.html',
          state: {}
        });
        alert('セーブしました。');
      } catch (error) {
        alert(error.message || 'セーブできませんでした。');
      } finally {
        saveButton.disabled = false;
      }
    });

    loadButton.addEventListener('click', async () => {
      if (!RenaiGameSave.getToken()) {
        alert('タイトル画面の「設定」からGitHubトークンを設定してください。');
        return;
      }

      loadButton.disabled = true;
      try {
        const save = await RenaiGameSave.loadFromGitHub();
        if (!save.hasSave || !save.page) {
          alert('セーブデータはまだありません。');
          return;
        }
        if (!RenaiGameSave.isSafePage(save.page)) {
          throw new Error('セーブデータの移動先が正しくありません。');
        }
        location.href = save.page;
      } catch (error) {
        alert(error.message || 'ロードできませんでした。');
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
