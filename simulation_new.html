<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>恋愛シュミレーション</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#f3edef;color:#2c2528;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100dvh}
    .screen{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{margin:0;font-size:20px;font-weight:700}
    .back{border:1px solid #bdaeb4;border-radius:10px;background:#fff;color:#2c2528;padding:10px 14px;text-decoration:none}
    #app{min-height:calc(100dvh - 84px)}
  </style>
</head>
<body>
  <main class="screen">
    <header class="top">
      <h1 class="title">恋愛シュミレーション</h1>
      <a class="back" href="simulation.html">戻る</a>
    </header>
    <section id="app"></section>
  </main>
</body>
</html>
