<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISON - はじめから</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eeeeea;
      color: #252525;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .back-link {
      display: inline-block;
      min-height: 48px;
      padding: 12px 0;
      font-size: 17px;
      color: #555;
      text-decoration: none;
    }

    h1 {
      margin: 28px 0;
      font-size: 28px;
      text-align: center;
    }

    .story-box {
      padding: 22px;
      background: #fff;
      border: 1px solid #bbb;
      border-radius: 12px;
    }

    .story-box p {
      margin: 0 0 20px;
      font-size: 18px;
      line-height: 1.8;
    }

    .story-box p:last-child {
      margin-bottom: 0;
    }

    .next-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 64px;
      margin-top: 20px;

      background: #333;
      border: none;
      border-radius: 10px;

      color: #fff;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
    }

    .next-button:active {
      background: #111;
    }
  </style>
</head>

<body>

  <main class="page">

    <a class="back-link" href="prison.html">
      ← PRISON
    </a>

    <h1>はじめから</h1>

    <div class="story-box">

      <p>
        地域のボランティア活動に参加したある日。
      </p>

      <p>
        あなたは、収監されている人との文通を行う
        ボランティア活動について知った。
      </p>

      <p>
        特別な使命感があったわけではない。
      </p>

      <p>
        少しの慈善心と、少しの興味。
      </p>

      <p>
        手紙を書くくらいなら、
        やってみてもいいかもしれないと思った。
      </p>

    </div>

    <a class="next-button" href="#">
      次へ
    </a>

  </main>

</body>
</html>
