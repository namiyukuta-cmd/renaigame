<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>恋愛シュミレーション</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background: #f3edef;
      color: #2c2528;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        calc(86px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      color: #6e6066;
      text-decoration: none;
      font-size: 17px;
    }

    .save-load {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .save-load button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid #bdaeb4;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.88);
      color: #2c2528;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-load button:active {
      background: #e8dfe2;
    }

    .save-load button:disabled {
      opacity: 0.55;
    }

    #app {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 22px;
      overflow: hidden;
    }

    .home-visual {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
    }

    .home-character-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    .room-scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #eee8e6 0 66%, #d8ceca 66% 100%);
      box-shadow: inset 0 0 0 1px rgba(118, 100, 106, 0.08);
    }

    .room-window {
      position: absolute;
      top: 9%;
      left: 8%;
      width: 38%;
      height: 34%;
      border: 7px solid #e2d9d6;
      background:
        linear-gradient(90deg, transparent 48%, rgba(213, 202, 198, 0.8) 48% 52%, transparent 52%),
        linear-gradient(transparent 48%, rgba(213, 202, 198, 0.8) 48% 52%, transparent 52%),
        linear-gradient(#dbe2e4, #f0eeee);
      box-shadow: 0 8px 16px rgba(71, 56, 61, 0.08);
    }

    .room-curtain {
      position: absolute;
      top: 6%;
      left: 4%;
      width: 9%;
      height: 45%;
      border-radius: 45% 25% 45% 20%;
      background: rgba(204, 190, 188, 0.82);
      box-shadow: 38vw 0 0 rgba(204, 190, 188, 0.72);
    }

    .room-sofa {
      position: absolute;
      left: 15%;
      bottom: 19%;
      width: 58%;
      height: 24%;
      border-radius: 20px 20px 13px 13px;
      background: #c6bab8;
      box-shadow: 0 12px 18px rgba(72, 57, 61, 0.13);
    }

    .room-sofa::before,
    .room-sofa::after {
      content: "";
      position: absolute;
      top: -13%;
      width: 44%;
      height: 58%;
      border-radius: 16px;
      background: #d3c8c5;
      box-shadow: inset 0 0 0 1px rgba(88, 68, 74, 0.06);
    }

    .room-sofa::before {
      left: 4%;
    }

    .room-sofa::after {
      right: 4%;
    }

    .room-table {
      position: absolute;
      left: 39%;
      bottom: 8%;
      width: 41%;
      height: 8%;
      border-radius: 50%;
      background: #b8a9a5;
      box-shadow: 0 8px 12px rgba(74, 59, 63, 0.12);
    }

    .room-table::after {
      content: "";
      position: absolute;
      left: 47%;
      top: 70%;
      width: 7%;
      height: 90%;
      background: #a69692;
    }

    .room-rug {
      position: absolute;
      left: 13%;
      bottom: 1%;
      width: 70%;
      height: 22%;
      border-radius: 50%;
      background: rgba(239, 232, 229, 0.82);
    }

    .room-plant {
      position: absolute;
      right: 7%;
      bottom: 16%;
      width: 13%;
      height: 28%;
    }

    .room-plant::before {
      content: "";
      position: absolute;
      left: 36%;
      bottom: 25%;
      width: 8%;
      height: 65%;
      background: #938d83;
      transform: rotate(-7deg);
      box-shadow: 17px -3px 0 -1px #938d83;
    }

    .room-plant::after {
      content: "";
      position: absolute;
      left: 15%;
      bottom: 0;
      width: 68%;
      height: 30%;
      border-radius: 8px 8px 18px 18px;
      background: #b3a49f;
    }

    .room-leaf {
      position: absolute;
      width: 52%;
      height: 20%;
      border-radius: 100% 0 100% 0;
      background: #a7a89c;
      transform-origin: right center;
    }

    .room-leaf.one {
      top: 1%;
      left: 0;
      transform: rotate(22deg);
    }

    .room-leaf.two {
      top: 18%;
      right: 0;
      transform: scaleX(-1) rotate(18deg);
    }

    .room-leaf.three {
      top: 34%;
      left: 3%;
      transform: rotate(10deg);
    }

    .content-panel {
      width: 100%;
      height: 100%;
      padding: 26px 22px;
      border: 1px solid #cdbfc4;
      border-radius: 14px;
      background: #faf7f8;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-panel h2 {
      margin: 0 0 24px;
      font-size: 30px;
    }

    .panel-note {
      margin: -12px 0 22px;
      color: #766970;
      font-size: 14px;
      line-height: 1.6;
    }

    .target-list {
      display: grid;
      gap: 14px;
    }

    .target-card {
      width: 100%;
      min-height: 118px;
      padding: 10px;
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      align-items: center;
      border: 1px solid #d4c8cc;
      border-radius: 14px;
      background: #fff;
      color: #2c2528;
      text-align: left;
      cursor: pointer;
    }

    .target-card:active {
      transform: scale(0.99);
      background: #f2ebed;
    }

    .target-card.selected {
      border-color: #8b777f;
      box-shadow: inset 0 0 0 1px #8b777f;
    }

    .target-thumb {
      width: 88px;
      height: 96px;
      overflow: hidden;
      border-radius: 10px;
      background: #eee7e8;
    }

    .target-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .target-room-thumb {
      position: relative;
      width: 88px;
      height: 96px;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(to bottom, #eee8e6 0 66%, #d8ceca 66% 100%);
    }

    .target-room-thumb::before {
      content: "";
      position: absolute;
      left: 12px;
      bottom: 18px;
      width: 50px;
      height: 27px;
      border-radius: 8px 8px 5px 5px;
      background: #c6bab8;
    }

    .target-room-thumb::after {
      content: "";
      position: absolute;
      right: 9px;
      top: 13px;
      width: 27px;
      height: 30px;
      border: 3px solid #ded4d1;
      background: #dfe4e5;
    }

    .target-name {
      margin: 0 0 7px;
      font-size: 19px;
      font-weight: 700;
    }

    .target-meta {
      margin: 0;
      color: #73666c;
      font-size: 13px;
      line-height: 1.55;
    }

    .target-status {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #6d5961;
    }

    .profile-field {
      margin-bottom: 22px;
    }

    .profile-field label {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .profile-field input,
    .profile-field textarea {
      width: 100%;
      border: 1px solid #bdaeb4;
      border-radius: 10px;
      background: #fff;
      color: #2c2528;
      font-size: 17px;
      outline: none;
    }

    .profile-field input {
      min-height: 50px;
      padding: 10px 12px;
    }

    .profile-field textarea {
      min-height: 240px;
      padding: 12px;
      line-height: 1.6;
      resize: vertical;
    }

    .profile-field input:focus,
    .profile-field textarea:focus {
      border-color: #75666c;
    }

    .record-list {
      display: grid;
      gap: 18px;
    }

    .record-entry {
      padding: 18px;
      border: 1px solid #d8cdd1;
      border-radius: 12px;
      background: #fff;
    }

    .record-entry h3 {
      margin: 0;
      font-size: 22px;
    }

    .record-date {
      margin-top: 4px;
      color: #7d7075;
      font-size: 13px;
    }

    .record-block {
      margin-top: 18px;
    }

    .record-label {
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #65585e;
    }

    .record-text {
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 16px;
    }

    .record-summary {
      padding-top: 14px;
      border-top: 1px solid #eee5e8;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      padding-bottom: env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #faf7f8;
      border-top: 1px solid #cdbfc4;
      z-index: 20;
    }

    .bottom-nav button {
      min-width: 0;
      min-height: 62px;
      padding: 10px 4px;
      border: 0;
      background: transparent;
      color: #65585e;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .bottom-nav button.active {
      color: #2c2528;
      font-weight: 700;
      background: #eee5e8;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-bar">
      <a class="back-link" href="simulation.html">← 恋愛シュミレーション</a>
      <div class="save-load">
        <button id="saveButton" type="button">セーブ</button>
        <button id="loadButton" type="button">ロード</button>
      </div>
    </div>

    <section id="app"></section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button id="homeButton" class="active" type="button">ホーム</button>
    <button id="romanceButton" type="button">恋愛相手</button>
    <button id="recordButton" type="button">記録</button>
    <button id="profileButton" type="button">プロフィール</button>
  </nav>

  <script src="js/simulation_characters.js"></script>
  <script src="js/simulation_save.js"></script>
  <script src="js/simulation_record.js"></script>
  <script>
    const PROFILE_KEY = 'renaigame_simulation_profile_v1';

    const saveButton = document.getElementById('saveButton');
    const loadButton = document.getElementById('loadButton');
    const homeButton = document.getElementById('homeButton');
    const romanceButton = document.getElementById('romanceButton');
    const recordButton = document.getElementById('recordButton');
    const profileButton = document.getElementById('profileButton');
    const app = document.getElementById('app');

    function readProfile() {
      try {
        const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
        return {
          name: typeof saved.name === 'string' ? saved.name : '',
          age: typeof saved.age === 'string' ? saved.age : '',
          free: typeof saved.free === 'string' ? saved.free : ''
        };
      } catch (_) {
        return { name: '', age: '', free: '' };
      }
    }

    function writeProfile(profile) {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    }

    function setActiveNav(button) {
      document.querySelectorAll('.bottom-nav button').forEach((item) => {
        item.classList.toggle('active', item === button);
      });
    }

    function renderRoom() {
      app.innerHTML = `
        <div class="home-visual" aria-label="部屋">
          <div class="room-scene" aria-hidden="true">
            <div class="room-window"></div>
            <div class="room-curtain"></div>
            <div class="room-rug"></div>
            <div class="room-sofa"></div>
            <div class="room-table"></div>
            <div class="room-plant">
              <span class="room-leaf one"></span>
              <span class="room-leaf two"></span>
              <span class="room-leaf three"></span>
            </div>
          </div>
        </div>
      `;
    }

    function showHome() {
      const character = RenaiGameCharacters.getSelected();
      const asset = RenaiGameCharacters.getHomeAsset(character);

      app.innerHTML = '';
      if (character && asset) {
        const visual = document.createElement('div');
        visual.className = 'home-visual';

        const image = document.createElement('img');
        image.className = 'home-character-image';
        image.src = asset;
        image.alt = character.name || '恋愛相手';

        visual.appendChild(image);
        app.appendChild(visual);
      } else {
        renderRoom();
      }

      setActiveNav(homeButton);
    }

    function makeTargetCard(character, selectedId) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'target-card';
      if (character.id === selectedId) button.classList.add('selected');

      const thumb = document.createElement('div');
      thumb.className = 'target-thumb';
      const asset = RenaiGameCharacters.getHomeAsset(character);
      if (asset) {
        const image = document.createElement('img');
        image.src = asset;
        image.alt = '';
        thumb.appendChild(image);
      }

      const text = document.createElement('div');
      const name = document.createElement('p');
      name.className = 'target-name';
      name.textContent = character.name || '名前未設定';
      text.appendChild(name);

      const meta = document.createElement('p');
      meta.className = 'target-meta';
      const age = character.common && character.common.age ? `年齢 ${character.common.age}` : '';
      const occupation = character.common && character.common.occupation ? character.common.occupation : '';
      meta.textContent = [age, occupation].filter(Boolean).join(' / ');
      text.appendChild(meta);

      if (character.id === selectedId) {
        const status = document.createElement('div');
        status.className = 'target-status';
        status.textContent = '選択中';
        text.appendChild(status);
      }

      button.appendChild(thumb);
      button.appendChild(text);
      button.addEventListener('click', () => {
        RenaiGameCharacters.setSelectedId(character.id);
        showHome();
      });

      return button;
    }

    function showRomanceTargets() {
      const selectedId = RenaiGameCharacters.getSelectedId();
      app.innerHTML = `
        <section class="content-panel" aria-labelledby="romanceTitle">
          <h2 id="romanceTitle">恋愛相手</h2>
          <p class="panel-note">ホームに表示する相手を選びます。</p>
          <div class="target-list" id="targetList"></div>
        </section>
      `;

      const list = document.getElementById('targetList');

      const roomButton = document.createElement('button');
      roomButton.type = 'button';
      roomButton.className = 'target-card';
      if (!selectedId) roomButton.classList.add('selected');
      roomButton.innerHTML = `
        <div class="target-room-thumb" aria-hidden="true"></div>
        <div>
          <p class="target-name">部屋</p>
          <p class="target-meta">恋愛相手を表示しない通常のホーム画面</p>
          ${!selectedId ? '<div class="target-status">選択中</div>' : ''}
        </div>
      `;
      roomButton.addEventListener('click', () => {
        RenaiGameCharacters.clearSelected();
        showHome();
      });
      list.appendChild(roomButton);

      RenaiGameCharacters.getAll().forEach((character) => {
        list.appendChild(makeTargetCard(character, selectedId));
      });

      setActiveNav(romanceButton);
    }

    function showProfile() {
      const profile = readProfile();
      app.innerHTML = `
        <section class="content-panel" aria-labelledby="profileTitle">
          <h2 id="profileTitle">プロフィール</h2>

          <div class="profile-field">
            <label for="profileName">名前</label>
            <input id="profileName" type="text" autocomplete="name">
          </div>

          <div class="profile-field">
            <label for="profileAge">年齢</label>
            <input id="profileAge" type="text" inputmode="numeric">
          </div>

          <div class="profile-field">
            <label for="profileFree">自由</label>
            <textarea id="profileFree"></textarea>
          </div>
        </section>
      `;

      const nameInput = document.getElementById('profileName');
      const ageInput = document.getElementById('profileAge');
      const freeInput = document.getElementById('profileFree');

      nameInput.value = profile.name;
      ageInput.value = profile.age;
      freeInput.value = profile.free;

      const saveProfile = () => {
        writeProfile({
          name: nameInput.value,
          age: ageInput.value,
          free: freeInput.value
        });
      };

      nameInput.addEventListener('input', saveProfile);
      ageInput.addEventListener('input', saveProfile);
      freeInput.addEventListener('input', saveProfile);

      setActiveNav(profileButton);
    }

    homeButton.addEventListener('click', showHome);
    romanceButton.addEventListener('click', showRomanceTargets);

    recordButton.addEventListener('click', async () => {
      setActiveNav(recordButton);
      await RenaiGameRecord.render(app);
    });

    profileButton.addEventListener('click', showProfile);

    saveButton.addEventListener('click', async () => {
      if (!RenaiGameSave.getToken()) {
        alert('タイトル画面の「設定」からGitHubトークンを設定してください。');
        return;
      }

      saveButton.disabled = true;
      try {
        await RenaiGameSave.saveToGitHub({
          version: 2,
          game: 'simulation',
          page: 'simulation_new.html',
          state: {
            profile: readProfile(),
            selectedCharacterId: RenaiGameCharacters.getSelectedId()
          }
        });
        alert('セーブしました。');
      } catch (error) {
        alert(error.message || 'セーブできませんでした。');
      } finally {
        saveButton.disabled = false;
      }
    });

    loadButton.addEventListener('click', async () => {
      if (!RenaiGameSave.getToken()) {
        alert('タイトル画面の「設定」からGitHubトークンを設定してください。');
        return;
      }

      loadButton.disabled = true;
      try {
        const save = await RenaiGameSave.loadFromGitHub();
        if (!save.hasSave || !save.page) {
          alert('セーブデータはまだありません。');
          return;
        }
        if (!RenaiGameSave.isSafePage(save.page)) {
          throw new Error('セーブデータの移動先が正しくありません。');
        }
        if (save.state && save.state.profile) {
          writeProfile(save.state.profile);
        }
        if (save.state && save.state.selectedCharacterId) {
          RenaiGameCharacters.setSelectedId(save.state.selectedCharacterId);
        } else {
          RenaiGameCharacters.clearSelected();
        }
        location.href = save.page;
      } catch (error) {
        alert(error.message || 'ロードできませんでした。');
      } finally {
        loadButton.disabled = false;
      }
    });

    async function init() {
      try {
        await RenaiGameCharacters.loadAll();
        showHome();
      } catch (error) {
        app.innerHTML = `
          <section class="content-panel">
            <h2>読み込みエラー</h2>
            <p>${error.message || '恋愛相手のデータを読み込めませんでした。'}</p>
          </section>
        `;
      }
    }

    init();
  </script>
</body>
</html>
