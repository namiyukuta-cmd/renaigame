<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>恋愛ゲーム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background: #f5f1f3;
      color: #2f292c;

      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      margin: 20px 0 8px;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 0 0 40px;
      text-align: center;
      font-size: 17px;
      color: #70666b;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .game-button {
      display: block;
      width: 100%;
      min-height: 86px;
      padding: 18px 20px;

      background: #ffffff;
      color: #2f292c;

      border: 1px solid #d9cdd2;
      border-radius: 16px;

      text-decoration: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.1s ease,
        background 0.1s ease;
    }

    .game-button:active {
      transform: scale(0.98);
      background: #eee7ea;
    }

    .game-title {
      display: block;
      margin-bottom: 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .game-description {
      display: block;
      font-size: 17px;
      line-height: 1.5;
      color: #71666b;
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>恋愛ゲーム</h1>

    <p class="subtitle">
      遊ぶ物語を選んでください
    </p>

    <div class="game-list">

      <a class="game-button" href="prison/prison.html">
        <span class="game-title">PRISON</span>
        <span class="game-description">
          収監中の男性との文通から始まる物語
        </span>
      </a>

      <a class="game-button" href="werewolf/werewolf.html">
        <span class="game-title">人狼</span>
        <span class="game-description">
          人ならざる者との恋愛
        </span>
      </a>

    </div>

  </main>

</body>
</html>
